name: Checker

on:
  push:
    branches: [feat/*, bug/*, dev/*, chore/*, develop]

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Compute cache key
        id: cache-key
        run:           echo "key=node_modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

  check:
    name: ${{ matrix.workspace }} / ${{ matrix.task.label }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        workspace: [client, server]
        task:
          - label: Type Check
            script: ts:check
          - label: Lint
            script: lint
          - label: Format Check
            script: format:check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run ${{ matrix.task.label }}
        run: npm run ${{ matrix.task.script }} -w ${{ matrix.workspace }}

  vitest:
    name: server / Vitest
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run Vitest with coverage
        run: npm run test:github -w server

      - name: Upload Vitest HTML Report
        uses: actions/upload-artifact@v7
        id: upload-report
        if: always()
        with:
          name: vitest-report
          path: server/html/

      - name: Link Reports to Job Summary
        if: always()
        run: |
          echo "### 📊 Vitest Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.upload-report.outputs.artifact-url }}" ]; then
            echo "[Download HTML Report](${{ steps.upload-report.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "HTML report unavailable (upload failed or no report produced)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Add Coverage Summary
        if: always()
        run: |
          if [ -f server/coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./server/coverage/coverage-summary.json').total;
              const fmt = (m) => \`\${m.pct}% (\${m.covered}/\${m.total})\`;
              console.log('| Metric | Coverage |');
              console.log('|---|---|');
              console.log(\`| Lines | \${fmt(s.lines)} |\`);
              console.log(\`| Statements | \${fmt(s.statements)} |\`);
              console.log(\`| Functions | \${fmt(s.functions)} |\`);
              console.log(\`| Branches | \${fmt(s.branches)} |\`);
            " >> $GITHUB_STEP_SUMMARY
          fi
