name: Checker

on:
  push:
    branches: [feat/*, bug/*, dev/*, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compute cache key
        id: cache-key
        run: echo "key=node_modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

  check:
    name: ${{ matrix.workspace }} / ${{ matrix.task.label }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        workspace: [client, server]
        task:
          - label: Type Check
            script: ts:check
          - label: Lint
            script: lint
          - label: Format Check
            script: format:check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run ${{ matrix.task.label }}
        run: npm run ${{ matrix.task.script }} -w ${{ matrix.workspace }}

  vitest:
    name: server / Vitest
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Run Vitest with coverage
        run: npm run test:github -w server

      - name: Upload Vitest HTML Report
        uses: actions/upload-artifact@v4
        id: upload-report
        if: always()
        with:
          name: vitest-report
          path: server/html/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        id: upload-coverage
        if: always()
        with:
          name: coverage-report
          path: server/coverage/

      - name: Link Reports to Job Summary
        if: always()
        run: |
          echo "### 📊 Vitest Test Results" >> $GITHUB_STEP_SUMMARY
          echo "[View Interactive HTML Report](https://viewer.vitest.dev/?url=${{ steps.upload-report.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "[Download Coverage Report](${{ steps.upload-coverage.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
