name: Lint Check

on:
  push:
    branches: [ feat/*, develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # Automates dependency caching

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint