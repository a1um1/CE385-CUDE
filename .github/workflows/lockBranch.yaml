name: Lock branch after merge
on:
  pull_request:
    types: [closed]

jobs:
  lock-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Lock the merged branch
        run: |
          curl -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/branches/${{ github.event.pull_request.head.ref }}/protection \
            -d '{
              "lock_branch": true,
              "required_status_checks": null,
              "enforce_admins": null,
              "required_pull_request_reviews": null,
              "restrictions": null
            }'
