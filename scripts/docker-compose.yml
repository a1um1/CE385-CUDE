services:
  database:
    container_name: db_backend
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql
    restart: unless-stopped
  go-judge:
    container_name: go-judge
    image: go-judge:latest
    build:
      context: ./go-judge
      dockerfile: Dockerfile
    privileged: true
    ports:
      - "5050:5050"
  garage:
    container_name: garage
    image: dxflrs/garage:v2.4.1
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-cude}
    volumes:
      - ./garage/garage.toml.local:/etc/garage.toml
      - garage_data:/var/lib/garage
    ports:
      - "3900:3900" # S3 API (presigned upload target)
      - "3902:3902" # S3 website (public read)
    restart: unless-stopped

volumes:
  db_data:
  garage_data:
